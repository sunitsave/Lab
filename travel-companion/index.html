<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="mobile-web-app-capable" content="yes">
<title>Travel Companion</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one phone-width column, big type and big targets for senior travellers; sections collapse to a header with a count. */
:root{
  --bg:#FFFFFF; --panel:#F3F3F1; --line:#D6D6D2; --ink:#1A1A1A; --muted:#4F4F4B;
  --accent:#1F5FAD; --accent-ink:#FFFFFF; --warn-bg:#FFF1D6; --warn-ink:#5C3200; --warn-line:#8A4B00;
  --sun:#8A4B00; --moon:#1F3A6B; --chip:#E4E4E0;
  --font:'Atkinson Hyperlegible', 'Segoe UI', Roboto, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141412; --panel:#1F1F1C; --line:#3A3A36; --ink:#F2F2EE; --muted:#B9B9B2;
  --accent:#7FB0F0; --accent-ink:#0B1A2E; --warn-bg:#3A2A10; --warn-ink:#FFD9A0; --warn-line:#D99A3A;
  --sun:#F0B860; --moon:#A9C4F5; --chip:#2E2E2A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141412; --panel:#1F1F1C; --line:#3A3A36; --ink:#F2F2EE; --muted:#B9B9B2;
  --accent:#7FB0F0; --accent-ink:#0B1A2E; --warn-bg:#3A2A10; --warn-ink:#FFD9A0; --warn-line:#D99A3A;
  --sun:#F0B860; --moon:#A9C4F5; --chip:#2E2E2A; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--font);font-size:18px;line-height:1.35;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 32px}
.app{max-width:520px;margin:0 auto;display:flex;flex-direction:column}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg{flex-shrink:0}
.top{display:flex;align-items:center;gap:12px;padding-block:14px 12px;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.iconbtn{width:56px;height:56px;border-radius:12px;border:2px solid var(--ink);background:var(--bg);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;color:var(--ink);text-decoration:none}
.top h1{margin:0;font-size:24px;flex:1;min-width:0;text-wrap:balance}
.hello{flex:1;min-width:0;display:flex;flex-direction:column}
.hello small{font-size:16px;color:var(--muted)}
.hello b{font-size:25px;line-height:1.1;overflow-wrap:anywhere}
.avatar{width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);background:var(--chip);object-fit:cover;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--muted)}
main{display:flex;flex-direction:column;gap:16px;padding-top:18px}
h2{margin:0;font-size:22px;display:flex;align-items:center;gap:10px}
.card{background:var(--panel);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.strong{border:2px solid var(--ink)}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.grow{flex:1;min-width:0}
.big{font-size:32px;font-weight:700;font-variant-numeric:tabular-nums}
.label{font-size:15px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.muted{color:var(--muted);font-size:16px}
.note{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px}
.warn{background:var(--warn-bg);color:var(--warn-ink);border:2px solid var(--warn-line);border-radius:12px;padding:12px;display:flex;gap:10px;align-items:flex-start}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.zone{background:var(--panel);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.zone .t{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.btn{min-height:56px;border-radius:12px;border:2px solid var(--ink);background:var(--bg);color:var(--ink);font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 14px;text-decoration:none;cursor:pointer;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{border-color:var(--warn-line);color:var(--warn-ink);background:var(--warn-bg)}
.sec{display:flex;flex-direction:column;gap:12px}
.sechead{min-height:72px;width:100%;box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;border:2px solid var(--ink);background:var(--bg);color:var(--ink);text-align:left;cursor:pointer}
.sechead .t{font-size:21px;font-weight:700;display:block}
.sechead .s{font-size:15px;color:var(--muted);display:block;overflow-wrap:anywhere}
.badge{min-width:26px;height:26px;padding:0 7px;box-sizing:border-box;border-radius:13px;background:var(--chip);color:var(--ink);font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.sugs{display:flex;flex-direction:column;gap:6px}
.sugs button{min-height:52px;text-align:left;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:16px;cursor:pointer}
.wxrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px}
.temp{min-height:56px;border-radius:12px;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:6px;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;padding:0 12px;color:var(--ink);cursor:pointer;white-space:nowrap}
.ferr{margin:0;color:var(--warn-ink);background:var(--warn-bg);border:2px solid var(--warn-line);border-radius:10px;padding:10px 12px;font-weight:700}
.ferr:empty{display:none}
.avbtn{padding:0;border:0;background:none;border-radius:50%;cursor:pointer;flex-shrink:0}
.overlay{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--bg);color:var(--ink);border-radius:20px;padding:20px;width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.sheet .bigav{width:180px;height:180px;border-radius:50%;object-fit:cover;border:3px solid var(--ink);background:var(--chip);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.sheet .btn{width:100%;box-sizing:border-box}
.sechead{scroll-margin-top:92px}
.summary{margin-top:8px;padding-top:14px;border-top:1px solid var(--line);font-size:15px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.summary b{color:var(--ink)}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.seg button{min-height:56px;border-radius:12px;border:2px solid var(--ink);background:var(--bg);color:var(--ink);font-size:18px;font-weight:700;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.empty{min-height:64px;display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;border:2px dashed var(--muted);color:var(--muted);text-decoration:none}
.empty b{color:var(--ink);font-size:17px;display:block}
.tile{min-height:112px;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:12px;border-radius:14px;border:2px solid var(--ink);color:var(--ink);text-decoration:none;min-width:0}
.tile b{font-size:18px;line-height:1.2}
.tile span{font-size:14px;color:var(--muted)}
.ph{border-radius:12px;background:var(--chip);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;overflow:hidden;flex-shrink:0}
.ph img{width:100%;height:100%;object-fit:cover}
.dose{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.dose div{display:flex;flex-direction:column;align-items:center;padding:6px 0;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--muted)}
.dose div.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dose b{font-size:20px}.dose span{font-size:13px}
.navlist{display:flex;flex-direction:column}
.navitem{min-height:76px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);background:none;border-left:0;border-right:0;border-top:0;padding:0;width:100%;text-align:left;cursor:pointer}
.navitem .t{font-size:20px;font-weight:700;display:block}
.navitem .s{font-size:15px;color:var(--muted);display:block}
.subitem{min-height:66px;display:flex;align-items:center;gap:14px;padding:0 12px;border-radius:12px;background:var(--panel);text-decoration:none;color:var(--ink)}
.subitem .t{font-size:19px;font-weight:700;display:block}.subitem .s{font-size:15px;color:var(--muted);display:block}
.grouplabel{margin:14px 0 2px;font-size:15px;font-weight:700;color:var(--muted);letter-spacing:.04em}
form{display:flex;flex-direction:column;gap:14px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:17px;font-weight:700}
label.f input,label.f select,label.f textarea{min-height:52px;border-radius:10px;border:2px solid var(--muted);padding:8px 12px;font-size:18px;font-weight:400;background:var(--bg);box-sizing:border-box;width:100%}
label.f textarea{min-height:90px;resize:vertical}
label.chk{display:flex;align-items:center;gap:12px;min-height:48px;font-size:17px}
label.chk input{width:28px;height:28px}
.listrow{display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:14px;padding:12px 14px;min-width:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:14px 18px;border-radius:12px;font-size:17px;max-width:min(90vw,480px);z-index:20}
.banner{background:var(--warn-bg);color:var(--warn-ink);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.step{display:flex;gap:6px}.step i{flex:1;height:6px;border-radius:3px;background:var(--chip)}.step i.on{background:var(--accent)}
.help ol{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:10px}
.help p{margin:0}
.foot{margin-top:20px;font-size:15px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>

function sunTimes(date,lat,lon){const r=Math.PI/180;const n=Math.round(date.getTime()/86400000+2440587.5-2451545.0+lon/360);const J=n+0.0008-lon/360;const M=(357.5291+0.98560028*J)%360;const C=1.9148*Math.sin(M*r)+0.02*Math.sin(2*M*r)+0.0003*Math.sin(3*M*r);const L=(M+C+180+102.9372)%360;const Jt=2451545+J+0.0053*Math.sin(M*r)-0.0069*Math.sin(2*L*r);const dec=Math.asin(Math.sin(L*r)*Math.sin(23.44*r));const cw=(Math.sin(-0.833*r)-Math.sin(lat*r)*Math.sin(dec))/(Math.cos(lat*r)*Math.cos(dec));if(cw<-1||cw>1)return null;const w=Math.acos(cw)/r;const toD=x=>new Date((x-2440587.5)*86400000);return {rise:toD(Jt-w/360),set:toD(Jt+w/360)};}
function dayInfo(tz,now,ll){const c=ll||COORDS[tz]||[20,tzOffsetMin(tz,now)/4];if(c){let s=sunTimes(now,c[0],c[1]);if(s){if(now<s.rise){return {day:false,rise:s.rise};}if(now<s.set){return {day:true,set:s.set};}const t=sunTimes(new Date(now.getTime()+86400000),c[0],c[1]);return {day:false,rise:t&&t.rise};}}const h=hourIn(tz,now);return {day:h>=6&&h<18,approx:true};}

async function placeName(lat,lon){

  try{const r=await fetch('https://api.bigdatacloud.net/data/reverse-geocode-client?latitude='+lat+'&longitude='+lon+'&localityLanguage=en');if(!r.ok)throw 0;const j=await r.json();

}
const WMO={95:'Thunderstorm',96:'Thunderstorm with hail',99:'Severe thunderstorm with hail',65:'Heavy rain',67:'Heavy freezing rain',75:'Heavy snow',82:'Violent rain showers',86:'Heavy snow showers',57:'Freezing drizzle',45:'Fog',48:'Freezing fog'};
function deriveAlerts(j){
  const h=j.hourly||{};const times=h.time||[];const out=[];const seen={};
  const fmt=i=>(times[i]||'').slice(11,16);
  const add=(k,txt)=>{if(!seen[k]){seen[k]=1;out.push(txt);}};
  for(let i=0;i<times.length;i++){
    const c=h.weather_code&&h.weather_code[i];const t=h.temperature_2m&&h.temperature_2m[i];const g=h.wind_gusts_10m&&h.wind_gusts_10m[i];const pr=h.precipitation&&h.precipitation[i];const uv=h.uv_index&&h.uv_index[i];
    if(WMO[c]&&c!==45&&c!==48)add((c===65||c===82)?'rain':'c'+c,WMO[c]+' expected around '+fmt(i));
    if((c===45||c===48))add('fog','Fog around '+fmt(i)+'. Take care on roads.');
    if(t>=40)add('xheat','Extreme heat: '+Math.round(t)+'°C around '+fmt(i)+'. Stay indoors and drink water.');
    else if(t>=37&&!seen.xheat)add('heat','High heat: '+Math.round(t)+'°C around '+fmt(i)+'. Avoid the midday sun.');
    if(t<=0)add('cold','Freezing: '+Math.round(t)+'°C around '+fmt(i)+'. Dress warmly.');
    if(g>=60)add('wind','Strong wind gusts of '+Math.round(g)+' km/h around '+fmt(i)+'.');
    if(pr>=7.5)add('rain','Heavy rain ('+pr.toFixed(1)+' mm in an hour) around '+fmt(i)+'.');
    if(uv>=8)add('uv','Very high UV ('+Math.round(uv)+') around '+fmt(i)+'. Use a cap and sunscreen.');
  }
  return seen.xheat?out.filter(x=>!/^High heat/.test(x)):out;
}

function loadGoogle(){if(!GOOGLE_MAPS_KEY)return Promise.resolve(null);if(gReady)return gReady;

    h+=section('zones','globe','Other time zones',esc(zs.map(z=>z.label||zoneName(z.tz)).join(' · ')),zs.length,body);
  } else missing.push('Other time zones');

  /* Contacts */
  if(data.contacts.length){
    const body='<div style="display:flex;flex-direction:column;gap:12px">'+data.contacts.map(c=>'<div class="card"><div><b style="font-size:20px">'+esc(c.name)+'</b><br><span class="muted">'+esc([c.relation,c.phone].filter(Boolean).join(' · '))+'</span></div><div class="grid2"><a class="btn primary" href="'+telHref(c.phone)+'">'+ic('phone',22)+'Call</a>'+(c.whatsapp&&waNum(c.phone)?'<a class="btn" href="https://wa.me/'+waNum(c.phone)+'" target="_blank" rel="noopener">'+ic('chat',22)+'WhatsApp</a>':'<span class="btn" aria-disabled="true" style="opacity:.5">No WhatsApp</span>')+'</div></div>').join('')+'</div>';
    h+=section('contacts','phone','Emergency contacts','Call or WhatsApp',data.contacts.length,body);

  /* Group + Translate tiles */

  h+=g.link?'<div class="grid2"><a class="tile" href="'+esc(g.link)+'" target="_blank" rel="noopener">'+ic('group')+'<b>Tour WhatsApp group</b><span>'+esc(g.name||'Opens WhatsApp')+'</span></a>'+trTile+'</div>':trTile;
  if(!g.link)missing.push('Tour WhatsApp group');

  /* Medication */
  const al=[data.allergies.food,data.allergies.medication].filter(x=>x&&x.trim());
  const mc=data.meds.length+al.length;
  if(mc){
    let body='<div class="card">';
    if(data.meds.length){body+='<span class="label">To be taken</span>'+data.meds.map(m=>'<div class="note" style="gap:10px"><div class="row">'+photoBox(m.photo,'64px','64px','Photo')+'<span class="grow"><b style="font-size:19px">'+esc(m.name)+'</b><br><span class="muted">'+esc((m.m||0)+'-'+(m.a||0)+'-'+(m.n||0)+(m.note?' · '+m.note:''))+'</span></span></div><div class="dose" role="img" aria-label="Dosage '+esc((m.m||0)+'-'+(m.a||0)+'-'+(m.n||0))+'">'+[['m','Morning'],['a','Afternoon'],['n','Night']].map(([k,l])=>'<div class="'+(m[k]&&m[k]!=='0'?'on':'')+'"><b>'+esc(m[k]||'0')+'</b><span>'+l+'</span></div>').join('')+'</div></div>').join('');}
    if(al.length){body+='<span class="label">Allergies</span>'+(data.allergies.food?'<div class="warn"><span><b>Food</b><br>'+esc(data.allergies.food)+'</span></div>':'')+(data.allergies.medication?'<div class="warn"><span><b>Medication</b><br>'+esc(data.allergies.medication)+'</span></div>':'');}
    body+='</div>';
    h+=section('meds','pill','Critical medication',data.meds.length+' medicine'+(data.meds.length===1?'':'s')+' · '+al.length+' allerg'+(al.length===1?'y':'ies'),mc,body);
  } else missing.push('Critical medication');

  /* Today */
  if(tday){h+=section('itin','cal',"Today's itinerary",esc(tday.place),1,dayCard(tday,true));}
  else notToday.push(data.days.length?"Today's itinerary (nothing planned for today)":"Itinerary (no days added)");

  /* Location */
  const busy=live.locBusy;
  const locBody='<div class="card">'+
    '<button class="btn primary" data-act="locGo" data-to="share"'+(busy?' disabled':'')+'>'+ic('chat',22)+(busy==='share'?'Finding your location…':'Share my location on WhatsApp')+'</button>'+
    '<div class="grid2"><button class="btn" style="min-height:72px;flex-direction:column;gap:4px" data-act="locGo" data-to="police"'+(busy?' disabled':'')+'>'+ic('shield',22)+(busy==='police'?'Finding…':'Police nearby')+'</button><button class="btn" style="min-height:72px;flex-direction:column;gap:4px" data-act="locGo" data-to="hospital"'+(busy?' disabled':'')+'>'+ic('cross',22)+(busy==='hospital'?'Finding…':'Hospital nearby')+'</button></div>'+
    (live.posErr==='denied'?'<div class="warn">'+ic('alert')+'<span>Location is blocked for this app. Tap the lock icon next to the web address and allow Location.</span></div>':'')+
    (live.posErr==='unavailable'?'<div class="warn">'+ic('alert')+'<span>Your location could not be found. Turn on Location on the phone and try again.</span></div>':'')+
    '<p class="muted" style="margin:0;font-size:15px">Each button finds where you are right now first.</p></div>';
  h+=section('loc','pin','Where I am now','Share location · Police · Hospital',3,locBody);

  /* Tomorrow */
  if(nday){
    const changed=tday&&nday.hotelId&&tday.hotelId!==nday.hotelId;
    h+=section('tom','calnext','Tomorrow',esc(nday.place)+(changed?' · <b style="color:var(--warn-line)">Hotel changes</b>':''),1,dayCard(nday,false,changed));
  } else if(data.days.length) notToday.push('Tomorrow (nothing planned)');

  /* Flight */
  const fl=data.flights.filter(f=>f.date===today).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  if(fl.length){
    const f0=fl[0];const dep=zonedToDate(f0.date,f0.time,validTz(f0.tz)?f0.tz:DEVICE_TZ);
    const sub=esc(f0.number)+(dep?(dep>now?' · leaves in '+dur(dep-now):' · departed'):'');

  } else notToday.push("Today's flight (no flight today)");

  /* Summary */
  const lines=[];
  if(!data.contacts.length)lines.push('<span><b>No emergency contact set.</b> Family can add one in Configuration.</span>');
  if(notToday.length)lines.push('<span><b>Not shown today:</b> '+notToday.map(esc).join(' · ')+'</span>');
  if(missing.length)lines.push('<span><b>Not set up:</b> '+missing.map(esc).join(' · ')+'</span>');
  if(lines.length)h+='<div class="summary" role="note">'+lines.join('')+'</div>';

  h+='</main>';
  if(profileOpen){
    h+='<div class="overlay" data-act="closeProfile"><div class="sheet" role="dialog" aria-modal="true" aria-label="My profile">'+(p.photo?'<img class="bigav" alt="" src="'+esc(p.photo)+'">':'<span class="bigav">'+ic('user',72)+'</span>')+
      '<b style="font-size:26px">'+esc(p.name||'Traveller')+'</b>'+(p.nationality?'<span style="font-size:18px">Nationality: <b>'+esc(p.nationality)+'</b></span>':'<span class="muted">Nationality not set</span>')+
      '<a class="btn primary" href="#profile">'+ic('edit',22)+'Edit profile</a><button type="button" class="btn" data-act="closeProfile">Close</button></div></div>';
  }
  return h;
}
function dayCard(d,isToday,hotelChanged){
  const ho=hotelById(d.hotelId);

  b+='<div><b style="font-size:22px">'+esc(d.place)+'</b>'+(d.location?'<br><span class="muted">'+esc(d.location)+'</span>':'')+'</div>';
  if(d.location)b+='<a class="btn" href="https://www.google.com/maps/dir/?api=1&destination='+enc(d.location)+'" target="_blank" rel="noopener">'+ic('pin',22)+'Directions</a>';

  if(d.clothes||d.clothesPhoto)b+='<div class="row">'+photoBox(d.clothesPhoto,'80px','80px','Outfit')+'<span class="grow"><span class="label">Wear</span><br>'+esc(d.clothes)+'</span></div>';

function flightCard(f,now){
  const tz=validTz(f.tz)?f.tz:DEVICE_TZ;const dep=zonedToDate(f.date,f.time,tz);
  let left='';if(dep){left=dep>now?'Leaves in '+dur(dep-now):'Departed '+dur(now-dep)+' ago';}
  return '<div class="card"><span class="label">Flight '+esc(f.number)+'</span><div class="row" style="justify-content:space-between"><b style="font-size:22px;overflow-wrap:anywhere" class="grow">'+esc(f.from)+'</b>'+ic('chev',28)+'<b style="font-size:22px;text-align:right;overflow-wrap:anywhere" class="grow">'+esc(f.to)+'</b></div>'+
   '<div><span>Departs '+esc(f.time)+' local time ('+esc(zoneName(tz))+')</span><br><b style="font-size:22px">'+left+'</b></div>'+
   (f.airport?'<a class="btn primary" href="https://www.google.com/maps/dir/?api=1&destination='+enc(f.airport)+'" target="_blank" rel="noopener">'+ic('pin',22)+'Directions to airport</a>':'')+

   (f.notes?'<div class="note"><span class="label">Flight notes</span><span>'+esc(f.notes)+'</span></div>':'')+'</div>';
}

const FORMS={
  days:{title:'Itinerary days',one:'day',sort:(a,b)=>(a.date||'').localeCompare(b.date||''),line:d=>[nice(d.date),d.place],fields:[

};
function fieldHtml(f,item){
  const [k,label,type,req]=f;let v=item?item[k]:'';if(!item&&type==='date')v=nextDate();const id='f-'+k;const r=req?' required':'';

  if(type==='photo'){const cur=k in draftPhotos?draftPhotos[k]:v;return '<div class="f" style="display:flex;flex-direction:column;gap:6px"><b style="font-size:17px">'+label+'</b><div class="row">'+photoBox(cur,'88px','88px')+'<span class="grow" style="display:flex;flex-direction:column;gap:8px"><label class="btn" for="'+id+'" style="min-height:52px">'+ic('camera',22)+(cur?'Change photo':'Add photo')+'</label><input type="file" accept="image/*" id="'+id+'" data-photo="'+k+'" hidden>'+(cur?'<button type="button" class="btn" style="min-height:48px" data-act="rmPhoto" data-key="'+k+'">Remove photo</button>':'')+'</span></div></div>';}
  if(type==='hotel')return '<label class="f" for="'+id+'">'+label+'<select id="'+id+'"><option value="">None</option>'+data.hotels.map(h=>'<option value="'+esc(h.id)+'"'+(h.id===v?' selected':'')+'>'+esc(h.name)+'</option>').join('')+'</select></label>'+(data.hotels.length?'':'<span class="muted">Add hotels first under Configuration › Hotels.</span>');
  if(type==='dose')return '<label class="f" for="'+id+'">'+label+'<select id="'+id+'">'+['0','½','1','2','3'].map(o=>'<option'+(String(v||'0')===o?' selected':'')+'>'+o+'</option>').join('')+'</select></label>';
  if(type==='place')return '<div class="f" style="display:flex;flex-direction:column;gap:6px"><label for="'+id+'" style="font-size:17px;font-weight:700">'+label+'</label><input id="'+id+'" data-place="'+k+'" value="'+esc(v)+'" placeholder="Start typing to search" autocomplete="off" style="min-height:52px;border-radius:10px;border:2px solid var(--muted);padding:8px 12px;font-size:18px;background:var(--bg);box-sizing:border-box;width:100%"><div class="sugs" id="sug-'+k+'" role="listbox" aria-label="Suggestions"></div><button type="button" class="btn" style="min-height:48px;font-size:16px" data-act="mapsCheck" data-key="'+k+'">'+ic('pin',20)+'Check on Google Maps</button></div>';

   '<span class="grow" style="display:flex;flex-direction:column;gap:8px"><label class="btn" for="f-photo">'+ic('camera',22)+(cur?'Change photo':'Add photo')+'</label><input type="file" accept="image/*" id="f-photo" data-photo="photo" hidden>'+(cur?'<button type="button" class="btn" data-act="rmPhoto" data-key="photo">Remove photo</button>':'')+'</span></div>'+
   '<label class="f" for="f-name">Name<input id="f-name" value="'+esc(p.name)+'"></label><label class="f" for="f-nat">Nationality<input id="f-nat" value="'+esc(p.nationality)+'" placeholder="e.g. Indian"></label><button class="btn primary" type="button" data-act="submitForm">Save profile</button></form></main>';
  return h;
}
function unitsView(){
  const seg=(k,opts)=>'<div class="seg" role="group">'+opts.map(([v,l])=>'<button type="button" data-act="setUnit" data-k="'+k+'" data-v="'+v+'" aria-pressed="'+(data.settings[k]===v)+'">'+l+'</button>').join('')+'</div>';
  return top('Units','config')+'<main><div class="card"><span class="label">Temperature</span>'+seg('temp',[['C','Celsius °C'],['F','Fahrenheit °F']])+'</div><div class="card"><span class="label">Distance</span>'+seg('dist',[['km','Kilometres'],['mi','Miles']])+'</div><p class="muted" style="margin:0">Changes save as soon as you tap.</p></main>';
}
function zonesView(){
  let h=top('Time zones','config')+'<main><div class="card"><span class="label">Time zones on home screen</span><p class="muted" style="margin:0">Local time always shows. Tap Set as home on one zone to show it under local time. Use the arrows to set the order of the others.</p>';
  data.zones.forEach((z,i)=>{h+='<div class="listrow" style="background:var(--bg)"><span class="grow"><b>'+(i+1)+'. '+esc(z.label||zoneName(z.tz))+'</b><br><span class="muted">'+esc(z.tz)+(validTz(z.tz)?' · now '+fmtTime(z.tz):' · not a valid zone')+'</span>'+(z.home?'<br><b style="color:var(--accent)">Home time zone</b>':'<br><button class="btn" style="min-height:44px;font-size:16px;margin-top:6px" data-act="zHome" data-i="'+i+'">Set as home</button>')+'</span><button class="iconbtn" style="width:48px;height:48px" data-act="zUp" data-i="'+i+'" aria-label="Move up"'+(i===0?' disabled':'')+'>'+ic('up',20)+'</button><button class="iconbtn" style="width:48px;height:48px" data-act="zDown" data-i="'+i+'" aria-label="Move down"'+(i===data.zones.length-1?' disabled':'')+'>'+ic('down',20)+'</button><button class="iconbtn" style="width:48px;height:48px" data-act="zDel" data-i="'+i+'" aria-label="Remove">'+ic('trash',20)+'</button></div>';});
  h+='<form data-form="zone" style="gap:10px"><label class="f" for="z-label">Name to show<input id="z-label" placeholder="e.g. Dubai"></label><label class="f" for="z-tz">Time zone<input id="z-tz" list="tzlist" placeholder="e.g. Asia/Dubai" autocomplete="off"></label><datalist id="tzlist">'+TZS.map(t=>'<option value="'+esc(t)+'">').join('')+'</datalist><label class="chk"><input type="checkbox" id="z-home">This is my home time zone</label><p class="ferr" id="zerr" role="alert"></p><button class="btn" type="button" data-act="submitForm">'+ic('plus',22)+'Add time zone</button></form></div></main>';
  return h;
}
function groupView(){
  return top('Tour WhatsApp group','config')+'<main><form data-form="group" class="card"><label class="f" for="g-name">Group name<input id="g-name" value="'+esc(data.group.name)+'"></label><label class="f" for="g-link">Invite link<input id="g-link" value="'+esc(data.group.link)+'" placeholder="https://chat.whatsapp.com/…" inputmode="url"></label><p class="muted" style="margin:0">In WhatsApp, open the group, tap its name, then Invite via link, then Copy link. Paste it here.</p><p class="muted" id="gerr" role="alert" style="margin:0"></p><button class="btn primary" type="button" data-act="submitForm">Save</button></form></main>';
}

/* ---------- BACKUP ---------- */
function backupView(){
  return top('Export / Import','config')+'<main>'+
   '<div class="card"><h2>'+ic('dl')+'Export</h2><p style="margin:0">Saves all trip details and photos into one .zip file. Keep it as a backup or send it to family.</p><button class="btn primary" data-act="export">Export as .zip</button></div>'+
   '<div class="card"><h2>'+ic('ul')+'Import</h2><p style="margin:0">Load a trip someone prepared for you from a .zip file.</p><div class="warn">'+ic('alert')+'<span>This replaces the trip on this phone.</span></div><label class="btn" for="importfile">Choose .zip file</label><input type="file" id="importfile" accept=".zip,application/zip" hidden>'+
   (importArmed?'<div class="note"><b>'+esc(importArmed.name)+'</b><span>Replace the trip on this phone with this file?</span><button class="btn danger" data-act="doImport">Replace my trip</button><button class="btn" data-act="cancelImport">Cancel</button></div>':'')+'</div>'+
   '<div class="card"><span class="label">Testing tools</span>'+(resetArmed==='reset'?'<button class="btn danger" data-act="doReset">Tap again to load the sample trip</button>':'<button class="btn" data-act="armReset">Load the sample trip</button>')+(resetArmed==='wipe'?'<button class="btn danger" data-act="doWipe">Tap again to delete everything</button>':'<button class="btn" data-act="armWipe">Delete all data on this phone</button>')+'</div></main>';
}

/* ---------- GUIDED TOUR pages ---------- */
const TOUR=[
 ['menu','The menu button','Top left on the home screen. It opens Guide, View itinerary and Configuration.'],
 ['clock','Time','Your local time, how much daylight is left, the temperature now, a Weather alerts button, and your home time zone. Other time zones are one tap below.'],
 ['phone','Emergency contacts','Tap to open. Each person has a Call button and a WhatsApp button.'],
 ['pill','Medication','Your medicines with photos and when to take them, shown as Morning-Afternoon-Night (for example 1-0-1), plus allergies.'],
 ['cal','Today and tomorrow','Where you are going, ticket tips, what to wear and carry, and your hotel. A hotel change is highlighted.'],
 ['pin','Where I am now','Share your location on WhatsApp, or find the nearest police station or hospital.'],
 ['sliders','Configuration','Family or the tour manager can fill in everything here, then export it as a .zip for you to import.']
];
function tourView(){
  const s=TOUR[tourStep];
  return top('App tour','menu')+'<main><div class="step" aria-hidden="true">'+TOUR.map((_,i)=>'<i class="'+(i<=tourStep?'on':'')+'"></i>').join('')+'</div><div class="card strong" style="min-height:260px;justify-content:center;align-items:flex-start">'+ic(s[0],48)+'<span class="muted">Step '+(tourStep+1)+' of '+TOUR.length+'</span><b style="font-size:26px">'+s[1]+'</b><p style="margin:0;font-size:20px">'+s[2]+'</p></div><div class="grid2"><button class="btn" data-act="tourPrev"'+(tourStep===0?' disabled style="opacity:.5"':'')+'>Back</button>'+(tourStep<TOUR.length-1?'<button class="btn primary" data-act="tourNext">Next</button>':'<a class="btn primary" href="#home">Finish</a>')+'</div></main>';
}
const HELP={
 wifi:['Wi-Fi connection','wifi',['Ask the hotel reception for the Wi-Fi name and password. It is often printed on the room key card.','Swipe down from the top of the screen and press and hold the Wi-Fi icon.','Tap the network with the hotel name, type the password, then tap Connect.','If a hotel page opens in the browser, enter your room number and surname to finish.'],'Avoid banking on open café Wi-Fi.'],
 network:['Phone network connection','signal',['Before you fly, check with your mobile company that international roaming is switched on for your number.','Abroad, open Settings, then Network & internet, then SIMs, and turn on Roaming.','If you bought a local SIM or eSIM, select it for Mobile data in the same SIMs screen.','Restart the phone if there is no signal after landing.'],'Roaming data can be costly. Turn Roaming off when you are on hotel Wi-Fi.'],
 inflight:['In-flight network connection','plane',['Switch on Aeroplane mode when the crew asks.','Turn Wi-Fi back on: swipe down and tap the Wi-Fi icon. Aeroplane mode stays on.','Choose the airline network (for example OnAir or the airline name).','Open the browser. The airline page opens; pick the free messaging plan or buy a plan.'],'Not every flight has Wi-Fi. Check the seat card or ask the crew.'],
 translate:['Translate','translate',['Tap Open Google Translate below. The Translate app opens; if it is not installed, the Play Store opens so you can install it.','Choose your language on the left and the local language on the right.','Tap the microphone and speak, then show the screen to the other person. Tap Conversation to talk in turns.','Tap Camera to translate signs and menus by pointing the phone at them.'],'Conversation mode lets both people speak in turn.']
};
function helpView(k){
  const [t,icon,steps,tip]=HELP[k];
  return top(t,'menu')+'<main class="help"><div class="card">'+ic(icon,40)+'<ol>'+steps.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ol></div><div class="note"><b>Tip</b><span>'+esc(tip)+'</span></div>'+
   (k==='translate'?'<a class="btn primary" href="'+TRANSLATE_HREF+'" target="_blank" rel="noopener">'+ic('translate',22)+'Open Google Translate</a>':'')+'</main>';
}

/* ---------- render ---------- */
function render(){
  const r=route();const app=document.getElementById('app');
  let h;
  if(r==='home')h=homeView();
  else if(r==='menu')h=menuView();
  else if(r==='itinerary')h=itineraryView();
  else if(r==='config')h=configView();
  else if(r==='profile')h=profileView();
  else if(r==='zones')h=zonesView();
  else if(r==='units')h=unitsView();
  else if(r==='group')h=groupView();
  else if(r==='backup')h=backupView();
  else if(r==='tour')h=tourView();
  else if(HELP[r])h=helpView(r);
  else if(FORMS[r])h=listView(r);
  else h=homeView();
  app.innerHTML='<div class="app-inner">'+h+'</div>';
}
window.addEventListener('online',()=>refreshWeather(true));
window.addEventListener('popstate',()=>{let r='home';try{r=(location.hash||'').slice(1);}catch(e){}go(r,true);});
window.addEventListener('hashchange',()=>{let r='home';try{r=(location.hash||'').slice(1);}catch(e){}if(valid(r)!==cur)go(r,true);});
/* in-app navigation: handle every #route link ourselves so it works inside any viewer */
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(!a)return;e.preventDefault();go(a.getAttribute('href').slice(1));},true);

/* ---------- photos ---------- */
function shrink(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=()=>rej(new Error('read'));fr.onload=()=>{const img=new Image();img.onload=()=>{const max=640;let w=img.width,h=img.height;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',0.72));};img.onerror=()=>rej(new Error('image'));img.src=fr.result;};fr.readAsDataURL(file);});}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='toggle'){const k=b.dataset.key;open[k]=!open[k];render();const hb=document.querySelector('[data-act=toggle][data-key="'+k+'"]');if(hb){try{hb.focus({preventScroll:true});}catch(x){}try{hb.scrollIntoView({block:'start',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});}catch(x){hb.scrollIntoView();}}return;}
  if(a==='openProfile'){profileOpen=true;render();const c=document.querySelector('.sheet .btn');if(c)c.focus();return;}
  if(a==='closeProfile'){if(e.target.closest('.sheet')&&b.classList.contains('overlay'))return;profileOpen=false;render();return;}
  if(a==='setUnit'){data.settings[b.dataset.k]=b.dataset.v;if(save())toast('Saved');render();return;}
  if(a==='locGo'){locGo(b.dataset.to);return;}
  if(a==='locate'){live.locBusy=true;live.posErr=null;render();getPos().then(()=>{live.locBusy=false;toast('Location found');render();refreshWeather(true);}).catch(()=>{live.locBusy=false;render();});return;}
  if(a==='tourToggle'){tourOpen=!tourOpen;render();return;}
  if(a==='armClearSample'){resetArmed='sample';render();return;}
  if(a==='clearSample'){data=blank();resetArmed=null;save();toast('Sample cleared. Add your trip in Configuration.');render();return;}
  if(a==='add'){edit={kind:b.dataset.kind,id:null};draftPhotos={};render();window.scrollTo(0,0);return;}
  if(a==='edit'){edit={kind:b.dataset.kind,id:b.dataset.id};draftPhotos={};render();window.scrollTo(0,0);return;}
  if(a==='cancelEdit'){edit=null;draftPhotos={};render();return;}
  if(a==='armDel'){pendingDelete=b.dataset.id;render();return;}
  if(a==='del'){const k=b.dataset.kind;data[k]=data[k].filter(x=>x.id!==b.dataset.id);if(k==='hotels')data.days.forEach(d=>{if(d.hotelId===b.dataset.id)d.hotelId=''});pendingDelete=null;data.sample=false;save();toast('Deleted');render();return;}
  if(a==='rmPhoto'){draftPhotos[b.dataset.key]='';render();return;}
  if(a==='zUp'||a==='zDown'){const i=+b.dataset.i,j=a==='zUp'?i-1:i+1;if(j<0||j>=data.zones.length)return;const t=data.zones[i];data.zones[i]=data.zones[j];data.zones[j]=t;save();render();return;}
  if(a==='zHome'){data.zones.forEach((z,i)=>z.home=i===+b.dataset.i);if(save())toast('Home time zone set');render();return;}
  if(a==='zDel'){data.zones.splice(+b.dataset.i,1);save();render();return;}
  if(a==='tourNext'){tourStep=Math.min(TOUR.length-1,tourStep+1);render();return;}
  if(a==='tourPrev'){tourStep=Math.max(0,tourStep-1);render();return;}
  if(a==='submitForm'){const f=b.closest('form[data-form]');if(f)handleSubmit(f);return;}
  if(a==='wxRetry'){refreshWeather(true);return;}
  if(a==='pickPlace'){const f=document.getElementById('f-'+b.dataset.key);if(f)f.value=b.dataset.val;const box=document.getElementById('sug-'+b.dataset.key);if(box)box.innerHTML='';gToken=null;return;}
  if(a==='mapsCheck'){const f=document.getElementById('f-'+b.dataset.key);const q=f?f.value.trim():'';if(!q){toast('Type the place or address first.');return;}const l=document.createElement('a');l.href='https://www.google.com/maps/search/?api=1&query='+enc(q);l.target='_blank';l.rel='noopener';document.body.appendChild(l);l.click();l.remove();return;}
  if(a==='export'){doExport();return;}
  if(a==='doImport'){doImport();return;}
  if(a==='cancelImport'){importArmed=null;render();return;}
  if(a==='armReset'){resetArmed='reset';render();return;}
  if(a==='doReset'){data=sample();resetArmed=null;save();toast('Sample trip loaded');render();return;}
  if(a==='armWipe'){resetArmed='wipe';render();return;}
  if(a==='doWipe'){data=blank();resetArmed=null;save();toast('All data deleted from this phone');render();return;}
});
document.addEventListener('change',async e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.photo){const f=el.files&&el.files[0];if(!f)return;try{draftPhotos[el.dataset.photo]=await shrink(f);render();}catch(err){toast('That photo could not be read. Try a JPG or PNG.');}return;}
  if(el.id==='importfile'){const f=el.files&&el.files[0];if(!f)return;importArmed=f;render();}
});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target.closest('form[data-form]');if(f)handleSubmit(f);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&profileOpen){profileOpen=false;render();return;}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||!e.target.matches('form[data-form] input:not([type=checkbox]):not([type=file])'))return;e.preventDefault();handleSubmit(e.target.closest('form[data-form]'));});
function handleSubmit(form){
  const kind=form.dataset.form;const val=id=>{const x=document.getElementById(id);return x?x.value.trim():'';};
  if(kind==='profile'){data.profile.name=val('f-name');data.profile.nationality=val('f-nat');if('photo' in draftPhotos)data.profile.photo=draftPhotos.photo;draftPhotos={};if(save())toast('Profile saved');render();return;}
  if(kind==='zone'){const tz=val('z-tz');if(!validTz(tz)||!tz){document.getElementById('zerr').textContent='Pick a time zone from the list, for example Asia/Dubai.';return;}const nz={label:val('z-label')||zoneName(tz),tz};if(document.getElementById('z-home').checked){data.zones.forEach(z=>z.home=false);nz.home=true;}data.zones.push(nz);if(save())toast('Time zone added');render();geocode(nz.label).then(c=>{if(c){nz.lat=c[0];nz.lon=c[1];save();render();}});return;}
  if(kind==='allergies'){data.allergies={food:val('al-food'),medication:val('al-med')};if(save())toast('Allergies saved');render();return;}
  if(kind==='group'){const l=val('g-link');if(l&&!/^https:\/\//.test(l)){document.getElementById('gerr').textContent='The link should start with https://';return;}data.group={name:val('g-name'),link:l};if(save())toast('Group saved');render();return;}
  const F=FORMS[kind];if(!F)return;
  const item=edit&&edit.id?data[kind].find(x=>x.id===edit.id):null;
  const out=item?Object.assign({},item):{id:uid()};
  for(const f of F.fields){const [k,label,type,req]=f;
    if(type==='photo'){if(k in draftPhotos)out[k]=draftPhotos[k];else if(!item)out[k]='';continue;}
    if(type==='check'){out[k]=document.getElementById('f-'+k).checked;continue;}
    const v=val('f-'+k);
    if(req&&!v){showErr(label+' is needed. Fill it in, then tap Save.','f-'+k);return;}
    if(type==='tz'&&v&&!validTz(v)){showErr('Pick a time zone from the list, for example Asia/Dubai.','f-'+k);return;}
    out[k]=v;}
  if(item){data[kind]=data[kind].map(x=>x.id===item.id?out:x);}else data[kind].push(out);
  edit=null;draftPhotos={};if(save())toast('Saved');render();window.scrollTo(0,0);
}

/* ---------- export / import ---------- */
async function doExport(){
  if(typeof JSZip==='undefined'){toast('The zip tool did not load. Check the internet connection and try again.');return;}
  const zip=new JSZip();let n=0;
  const copy=JSON.parse(JSON.stringify(data,(k,v)=>{if(typeof v==='string'&&v.startsWith('data:image/')){n++;const name='photos/photo-'+n+'.jpg';zip.file(name,v.split(',')[1],{base64:true});return name;}return v;}));
  copy.exportedAt=new Date().toISOString();copy.app='Travel Companion '+BUILD;
  zip.file('data.json',JSON.stringify(copy,null,2));
  const blob=await zip.generateAsync({type:'blob'});
  const fname='travel-companion-'+dateIn(DEVICE_TZ)+'.zip';
  let dl=null;try{dl=await (window.claude&&window.claude.use?window.claude.use('downloads'):null);}catch(e){dl=null;}
  if(!dl){try{const u=URL.createObjectURL(blob);const l=document.createElement('a');l.href=u;l.download=fname;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);toast('Backup saved: '+fname);}catch(e){toast('Saving files is not available in this view.');}return;}
  try{await dl.save({filename:fname,data:blob});toast('Backup saved: '+fname);}
  catch(err){toast(err&&err.code==='declined'?'Export cancelled':'The backup could not be saved here.');}
}
async function doImport(){
  const f=importArmed;if(!f)return;
  if(typeof JSZip==='undefined'){toast('The zip tool did not load. Check the internet connection and try again.');return;}
  try{
    const zip=await JSZip.loadAsync(f);const j=zip.file('data.json');if(!j)throw new Error('nodata');
    const parsed=JSON.parse(await j.async('string'));
    const photos={};await Promise.all(Object.keys(zip.files).filter(p=>p.startsWith('photos/')&&!zip.files[p].dir).map(async p=>{photos[p]='data:image/jpeg;base64,'+await zip.file(p).async('base64');}));
    const restored=JSON.parse(JSON.stringify(parsed),(k,v)=>typeof v==='string'&&photos[v]?photos[v]:v);
    delete restored.exportedAt;delete restored.app;restored.sample=false;
    data=normalize(restored);importArmed=null;save();toast('Trip imported');go('home');
  }catch(err){importArmed=null;render();toast('This file is not a Travel Companion backup. Choose the .zip made by Export.');}
}

/* ---------- start ---------- */
render();
refreshWeather();
setInterval(()=>refreshWeather(),30*60000);
setInterval(()=>{if(route()==='home'&&!document.activeElement.matches('input,textarea,select'))render();},30000);
})();
